name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create, e.g. v1.5.1-qq.1'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "VERSION=${INPUT_VERSION:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web assets
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Windows binaries
        run: |
          set -euo pipefail
          make release TARGET=windows/amd64 VERSION="$VERSION"
          make release TARGET=windows/arm64 VERSION="$VERSION"
          cd dist
          for f in *.exe; do zip "${f%.exe}.zip" "$f"; done
          sha256sum ./*.zip > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/*.zip dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
